[package]
name = "roadpilot"
version = "0.1.0"
description = "Autonomous driving assistant for Euro Truck Simulator 2 and American Truck Simulator"
edition = "2021"
rust-version = "1.77.2"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
